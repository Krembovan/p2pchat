<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>p2pchat</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e0a;--surface:#0d130d;--border:#00ff41;--text:#00ff41;--dim:#006b1a;--dim2:#008a22;--self:#00cc33;--accent:#33ff66;--pink:#ff66b2;--yellow:#ffff66}
html,body{height:100%}
body{
  font-family:'Courier New','Consolas','Liberation Mono',monospace;
  background:var(--bg);color:var(--text);display:flex;overflow:hidden;
  font-size:14px;line-height:1.5
}
::selection{background:var(--text);color:var(--bg)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:3px}

.app{display:flex;flex-direction:column;width:100%;height:100%}

/* ─── TOP BAR ─── */
.top-bar{
  display:flex;align-items:center;gap:12px;padding:6px 16px;
  background:var(--surface);border-bottom:1px solid var(--dim);
  flex-shrink:0;font-size:12px;user-select:none;min-height:32px
}
.top-bar .logo{color:var(--accent);font-weight:700;font-size:13px}
.top-bar .sep{color:var(--dim)}
.top-bar .chan{color:var(--text)}
.top-bar .info{margin-left:auto;color:var(--dim);font-size:11px}
.top-bar .info span{color:var(--text)}
.top-bar .settings-btn{
  background:none;border:1px solid var(--dim);color:var(--dim);
  cursor:pointer;padding:1px 6px;font-size:11px;font-family:inherit;
  transition:all .15s
}
.top-bar .settings-btn:hover{color:var(--text);border-color:var(--text)}

/* ─── MESSAGES ─── */
.term{
  flex:1;overflow-y:auto;padding:8px 16px 4px;
  display:flex;flex-direction:column;
  background:var(--bg)
}

.term .welcome{
  display:flex;flex-direction:column;gap:4px;padding:20px 0;color:var(--dim)
}
.term .welcome .t{color:var(--accent);font-weight:700;font-size:16px}
.term .welcome .s{font-size:12px}
.term .welcome .hl{color:var(--text)}

.term .ln{
  padding:0;line-height:1.5;word-wrap:break-word;
  animation:fade .1s ease-out;white-space:pre-wrap
}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
.term .ln .time{color:var(--dim);margin-right:8px}
.term .ln .name{font-weight:700}
.term .ln .name.peer{color:var(--yellow)}
.term .ln .name.self{color:var(--self)}
.term .ln .chan-tag{color:var(--dim2);margin-right:6px;font-size:12px}
.term .ln.sys{color:var(--dim2)}
.term .ln.cmd{color:var(--accent)}
.term .ln .hlp{color:var(--dim2)}
.term .ln .hlp-k{color:var(--accent);font-weight:700}

/* ─── PROMPT ─── */
.prompt-line{
  display:flex;align-items:center;padding:4px 16px 8px;
  background:var(--bg);border-top:1px solid var(--dim);flex-shrink:0;gap:0
}
.prompt-line .prompt{
  color:var(--accent);white-space:nowrap;flex-shrink:0;
  font-size:13px;margin-right:8px
}
.prompt-line .prompt .ch{color:var(--text)}
.prompt-line input{
  flex:1;background:transparent;border:none;color:var(--text);
  font-family:inherit;font-size:13px;outline:none;caret-color:var(--text);
  padding:4px 0
}
.prompt-line input::placeholder{color:var(--dim)}
.prompt-line .cmd-hint{
  display:none;position:absolute;bottom:100%;left:80px;right:16px;
  background:var(--surface);border:1px solid var(--dim);padding:8px 10px;
  font-size:11px;color:var(--dim2);margin-bottom:4px;z-index:10
}
.prompt-line .cmd-hint.show{display:block}

/* ─── MODAL ─── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);padding:20px;
  width:90%;max-width:340px;font-size:13px
}
.modal h3{color:var(--accent);margin-bottom:12px;font-weight:400;font-size:14px}
.modal label{display:block;color:var(--dim);margin-bottom:2px;font-size:11px}
.modal input[type=text]{
  width:100%;padding:6px 8px;background:var(--bg);border:1px solid var(--dim);
  color:var(--text);font-family:inherit;font-size:13px;outline:none;margin-bottom:10px
}
.modal input[type=text]:focus{border-color:var(--border)}
.modal .hint{font-size:11px;color:var(--dim);margin-bottom:10px}
.modal .actions{display:flex;gap:6px;justify-content:flex-end}
.modal .actions button{
  padding:6px 14px;border:1px solid var(--dim);background:var(--surface);
  color:var(--text);cursor:pointer;font-family:inherit;font-size:12px
}
.modal .actions button:hover{border-color:var(--border)}
.modal .actions .save{background:var(--border);color:var(--bg);font-weight:700}
.modal .actions .save:hover{background:var(--accent)}
.modal .conn-info{margin-top:10px;padding-top:10px;border-top:1px solid var(--dim)}
.modal .conn-info .row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--dim)}
.modal .conn-info .row .val{color:var(--text)}

@media(max-width:600px){
  body{font-size:12px}
  .term{padding:4px 8px 2px}
  .prompt-line{padding:4px 8px 6px}
  .prompt-line .prompt{font-size:11px}
  .top-bar{padding:4px 8px;font-size:11px}
}
</style>
</head>
<body>

<div class="app">
  <div class="top-bar">
    <span class="logo">[p2p]</span>
    <span class="sep">│</span>
    <span class="chan" id="chanDisplay">#general</span>
    <span class="info">
      <span id="count">0</span> online
      <span id="typingInfo" style="margin-left:12px;font-style:italic"></span>
    </span>
    <button class="settings-btn" id="settingsBtn">⚙</button>
  </div>

  <div class="term" id="term">
    <div class="welcome" id="welcome">
      <div class="t">╔═ [p2p] ═══════════════╗</div>
      <div class="t">║  p2pchat v1.2        ║</div>
      <div class="t">╚═══════════════════════╝</div>
      <div class="s">Type <span class="hl">/help</span> for commands</div>
      <div class="s">Waiting for peers...</div>
    </div>
  </div>

  <div class="prompt-line">
    <span class="prompt" id="prompt">[p2p@<span class="ch">#general</span>]$</span>
    <input id="input" placeholder="type /help" autofocus spellcheck="false" autocomplete="off">
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>// settings</h3>
    <label>your name</label>
    <input type="text" id="nameInput" placeholder="Name">
    <label>manual connect</label>
    <input type="text" id="connectInput" placeholder="192.168.1.5:9000">
    <div class="hint">if auto-discovery doesn't work</div>
    <div class="actions">
      <button class="cancel" id="modalCancel">close</button>
      <button class="save" id="modalSave">save</button>
    </div>
    <div class="conn-info">
      <div class="row"><span>name</span><span class="val" id="infoName">-</span></div>
      <div class="row"><span>peers</span><span class="val" id="infoPeers">0</span></div>
    </div>
  </div>
</div>

<script>
// ─── STATE ───
let myName = '';
let curChan = 'general';
let peers = [];
let typingPeers = {};
let notifOn = true;

// ─── COLORS ───
const NAME_COLORS = {};
const COLORS = ['#ff66b2','#ffff66','#66ff66','#66ffff','#ff9966','#ff6666','#cc66ff','#66ccff'];

function nameColor(name) {
  if (!NAME_COLORS[name]) {
    let h=0; for(let i=0;i<name.length;i++) h=((h<<5)-h+name.charCodeAt(i))|0;
    NAME_COLORS[name] = COLORS[Math.abs(h)%COLORS.length];
  }
  return NAME_COLORS[name];
}

// ─── CHANNELS ───
let channels = new Set(['general']);

function switchChan(name) {
  curChan = name;
  document.getElementById('chanDisplay').textContent = '#' + name;
  document.getElementById('prompt').innerHTML = '[p2p@<span class="ch">#' + name + '</span>]$';
  // Re-render visible messages
  renderVisible();
  document.getElementById('input').focus();
}

function renderVisible() {
  const term = document.getElementById('term');
  for (const el of term.children) {
    if (el.classList.contains('ln')) {
      const ch = el.dataset.channel || 'general';
      el.style.display = (ch === curChan) ? '' : 'none';
    }
  }
}

// ─── LOG ───
function log(type, text, name, channel) {
  const w = document.getElementById('welcome');
  if (w) w.style.display = 'none';

  const term = document.getElementById('term');
  const el = document.createElement('div');
  el.className = 'ln';
  if (channel) el.dataset.channel = channel;
  if (type === 'sys') { el.classList.add('sys'); el.dataset.channel = 'general' }
  if (type === 'cmd') el.classList.add('cmd');

  const time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  if (type === 'sys') {
    el.innerHTML = `<span class="time">[${time}]</span> ${text}`;
  } else if (type === 'msg' || type === 'self') {
    const cls = type === 'self' ? 'self' : 'peer';
    const chTag = (channel && channel !== curChan) ? `<span class="chan-tag">#${channel}</span>` : '';
    el.innerHTML = `<span class="time">[${time}]</span> ${chTag}<span class="name ${cls}" style="color:${nameColor(name)}">${name}</span> ${text}`;
  } else if (type === 'cmd') {
    el.innerHTML = text;
    handleCmd(text);
    if (text.startsWith('/join ') || text.startsWith('/leave ') || text === '/channels' || text === '/chs') return;
  } else {
    el.textContent = text;
  }

  term.appendChild(el);
  term.scrollTop = term.scrollHeight;

  // Show only if current channel
  const ch = el.dataset.channel || 'general';
  el.style.display = (ch === curChan) ? '' : 'none';

  // Notifications
  if (notifOn && type === 'msg' && document.hidden) {
    try {
      const n = new Notification('p2pchat', { body: name + ': ' + text, silent: true });
      setTimeout(() => n.close(), 4000);
    } catch(e) {}
  }
}

// ─── COMMANDS ───
function handleCmd(cmd) {
  const parts = cmd.split(' ');
  if (cmd === '/channels' || cmd === '/chs') {
    const list = [...channels].sort();
    log('sys', 'channels: ' + list.map(c => '#' + c).join('  '));
    return;
  }
  if (cmd.startsWith('/join ')) {
    const ch = parts[1];
    if (ch && !channels.has(ch)) {
      channels.add(ch);
      log('sys', '→ joined #' + ch);
    }
    switchChan(ch || 'general');
    return;
  }
  if (cmd.startsWith('/leave ')) {
    const ch = parts[1];
    if (ch && channels.has(ch) && ch !== 'general') {
      channels.delete(ch);
      log('sys', '→ left #' + ch);
    }
    if (curChan === ch) switchChan('general');
    return;
  }
}

// ─── SSE ───
let es;
function connectSSE() {
  if (es) es.close();
  es = new EventSource('/events');
  es.onmessage = e => {
    let d;
    try { d = JSON.parse(e.data) } catch { return }

    if (d.type === 'peers') {
      peers = d.names || [];
      document.getElementById('count').textContent = peers.length;
      return;
    }
    if (d.type === 'typing') {
      typingPeers[d.name] = Date.now();
      return;
    }
    if (d.type === 'system') {
      log('sys', d.text, '', d.channel);
      return;
    }
    if (d.type === 'cmd') {
      handleCmd(d.text);
      return;
    }
    if (d.type === 'msg' || d.type === 'self') {
      log(d.type, d.text || '', d.name || '', d.channel || 'general');
    }
  };
  es.onerror = () => { setTimeout(connectSSE, 2000) };
}

// ─── TYPING ───
setInterval(() => {
  const now = Date.now();
  const active = Object.entries(typingPeers).filter(([_,t]) => now - t < 3000).map(([n])=>n);
  const el = document.getElementById('typingInfo');
  el.textContent = active.length ? active.join(', ') + ' typing...' : '';
}, 500);

// ─── SEND ───
function doSend() {
  const i = document.getElementById('input');
  const text = i.value.trim();
  if (!text) return;

  // Handle channel commands locally
  if (text.startsWith('/join ') || text.startsWith('/leave ') || text === '/channels' || text === '/chs') {
    handleCmd(text);
    i.value = '';
    return;
  }

  fetch('/send', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'text=' + encodeURIComponent(text) + '&channel=' + encodeURIComponent(curChan)
  });
  i.value = '';
  document.getElementById('input').focus();
}

// ─── TYPING POST ───
let typingTimer = 0;
function sendTyping() {
  const now = Date.now();
  if (now - typingTimer < 1000) return;
  typingTimer = now;
  navigator.sendBeacon('/typing', new URLSearchParams({text:'1'}));
}

// ─── INIT ───
fetch('/info').then(r=>r.json()).then(d=>{
  myName = d.name;
  document.getElementById('infoName').textContent = myName;
  document.getElementById('infoPeers').textContent = (d.peers||[]).length;
  connectSSE();
}).catch(()=>{});

// ─── INPUT ───
const input = document.getElementById('input');
input.onkeydown = e => {
  if (e.key === 'Enter') { e.preventDefault(); doSend(); return }
  if (e.key === 'Tab') { e.preventDefault(); return }
  sendTyping();
};

// Settings
const modal = document.getElementById('modal');
document.getElementById('settingsBtn').onclick = () => {
  document.getElementById('nameInput').value = myName;
  document.getElementById('connectInput').value = '';
  document.getElementById('infoPeers').textContent = peers.length;
  modal.classList.add('open');
};
document.getElementById('modalCancel').onclick = () => modal.classList.remove('open');
modal.onclick = e => { if (e.target === modal) modal.classList.remove('open') };
document.getElementById('modalSave').onclick = () => {
  const name = document.getElementById('nameInput').value.trim();
  const addr = document.getElementById('connectInput').value.trim();
  if (name && name !== myName) {
    myName = name;
    fetch('/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'text=' + encodeURIComponent('/name ' + name)
    });
  }
  if (addr) {
    fetch('/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'text=' + encodeURIComponent('/connect ' + addr)
    });
  }
  modal.classList.remove('open');
};
</script>
</body>
</html>
